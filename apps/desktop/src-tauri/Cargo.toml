[package]
name = "pitwall-rs"
version = "0.1.0"
description = "PITWALL desktop — unofficial F1 strategy evaluator"
authors = ["Xander McKie"]
edition.workspace = true
license.workspace = true

[lib]
name = "pitwall_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pitwall-sim = { path = "../../../crates/pitwall-sim" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json = "1"
