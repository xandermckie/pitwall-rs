[workspace]
resolver = "2"
members = [
    "crates/pitwall-sim",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/xandermckie/pitwall-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = { version = "0.8", features = ["std_rng"] }
rand_distr = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
